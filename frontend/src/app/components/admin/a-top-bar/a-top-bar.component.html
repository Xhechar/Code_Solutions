<div class="topbar">
  <div class="logo-area">
    <div class="logo">
      <div class="bug-icon">
        <i class='bx bxs-bug' ></i>
      </div>
      <span class="logo-text">Building Solutions</span>
    </div>
  </div>
  
  <div class="nav-actions">
    <button class="action-btn create-btn" routerLink="create-problem">
      <i class='bx bxs-folder-plus'></i>
      <span class="tooltip">Create New</span>
    </button>
    
    <button class="action-btn analytics-btn" routerLink="/home">
      <i class='bx bx-home' ></i>
      <span class="tooltip">Home</span>
    </button>
    
    <button class="action-btn solutions-btn" routerLink="problems">
      <i class='bx bx-git-repo-forked' ></i>
      <span class="tooltip">Solutions</span>
    </button>
    
    <button class="action-btn notifications-btn" (click)="switchSidebarVisibility()">
      <i class='bx bx-menu' ></i>
      <span class="tooltip">Toggle Side Menu</span>
    </button>
    
    <div class="user-profile">
      <div class="profile-info">
        <div class="profile-name">{{user.FullName}}</div>
        <div class="profile-role">{{user.Role}}</div>
      </div>
      <div class="profile-img profile-btn" (click)="toggleProfileMenu($event)">
        <img [src]="user.ProfileImage" alt="Admin">
      </div>
    </div>
  </div>
</div>

<!-- Dropdown Menu -->
<div class="dropdown-menu" [class.active]="showProfileMenu">
  <a routerLink="profile" class="dropdown-item">
    <i class="fas fa-user"></i>
    Profile
  </a>
  <a routerLink="profile" class="dropdown-item">
    <i class="fas fa-edit"></i>
    Edit Settings
  </a>
  <a routerLink="profile" class="dropdown-item">
    <i class="fas fa-cog"></i>
    Account Settings
  </a>
  <div class="dropdown-divider"></div>
  <a href="#" class="dropdown-item">
    <i class="fas fa-sign-out-alt"></i>
    Sign Out
  </a>
</div>

<!-- Notification Panel -->
<div class="notification-panel" [class.active]="showNotifications">
  <div class="notification-header">
    <span class="notification-title">Notifications</span>
    <button class="mark-read" (click)="markAllAsRead()">Mark all as read</button>
  </div>
  <div class="notification-item" *ngFor="let notification of notifications">
    <div class="notification-icon">
      <i [class]="notification.iconClass"></i>
    </div>
    <div class="notification-content">
      <div class="notification-text" [innerHTML]="notification.text"></div>
      <div class="notification-time">{{notification.time}}</div>
    </div>
    <div class="unread-indicator" *ngIf="notification.unread"></div>
  </div>
  <a href="#" class="view-all">View all notifications</a>
</div>
