<app-notifications></app-notifications>
<div class="form-container">
  <form #verifyForm="ngForm" (ngSubmit)="onSubmit(verifyForm.value)" class="form">
    <h2>Verify Your Email</h2>
    <p class="form-description">Please enter your email address to receive a verification code</p>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="Email" 
        name="Email"
        ngModel
        #Email="ngModel" 
        required 
        pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
        placeholder="Enter your email address">
      
      <div *ngIf="Email.invalid && (Email.dirty || Email.touched)" class="error-messages">
        <p *ngIf="Email.errors?.['required']">Email is required</p>
        <p *ngIf="Email.errors?.['pattern']">Please enter a valid email address</p>
      </div>
    </div>
    
    <button type="submit" [disabled]="verifyForm.invalid" class="btn-submit">
      <span class="btn-text">Send Verification Code</span>
      <span class="btn-icon">→</span>
    </button>
  </form>
</div>
