<app-notifications></app-notifications>
<div class="top-bar">
  <div class="top-bar-left">
    <div class="brand">
      <i class="bx bx-code-alt"></i>
      <span class="brand-name">Code Solutions</span>
    </div>
  </div>
  
  <div class="top-bar-right">
    <div class="notification-icon">
      <i class="bx bx-bell"></i>
      <span class="notification-badge">3</span>
    </div>
    
    <div class="create-button" (click)="toggleCreateMenu()">
      <i class="bx bx-plus"></i>
      <span>Create</span>
      <div class="create-dropdown" [class.active]="isCreateMenuOpen">
        <a routerLink="create-problem"><i class="bx bx-error"></i> New Error</a>
        <a routerLink="contributions/my-solutions"><i class="bx bx-check-shield"></i> New Solution</a>
      </div>
    </div>
    
    <div class="profile-section" (click)="toggleProfileMenu()">
      <div class="profile-info">
        <div class="profile-name">{{user.FullName}}</div>
        <div class="profile-role">{{user.Username}}</div>
      </div>
      
      <div class="profile-image">
        <img [src]="user.ProfileImage" [alt]="user.Username" class="profile-avatar">
        <div class="online-indicator"></div>
      </div>
      
      <i class="bx bx-chevron-down profile-dropdown-icon"></i>
      
      <div class="profile-dropdown" [class.active]="isProfileMenuOpen">
        <div class="dropdown-header">
          <strong>{{user.FullName}}</strong>
          <span>{{user.Role}}</span>
        </div>
        <div class="dropdown-divider"></div>
        <a routerLink="my-profile"><i class="bx bx-user"></i> View Profile</a>
        <a routerLink="contributions/my-solutions"><i class="bx bx-code-curly"></i> My Solutions</a>
        <a routerLink="contributions/my-problems"><i class="bx bx-error-circle"></i> My Problems</a>
        <a routerLink="my-profile"><i class="bx bx-badge-check"></i> Achievements</a>
        <div class="dropdown-divider"></div>
        <a><i class="bx bx-cog"></i> Settings</a>
        <a class="logout"><i class="bx bx-log-out"></i> Logout</a>
      </div>
    </div>
  </div>
</div>
