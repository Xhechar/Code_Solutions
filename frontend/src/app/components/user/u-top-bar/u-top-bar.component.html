<div class="top-bar">
  <div class="top-bar-left">
    <div class="brand">
      <i class="bx bx-code-alt"></i>
      <span class="brand-name">Code Solutions</span>
    </div>
  </div>
  
  <div class="top-bar-right">
    <div class="notification-icon">
      <i class="bx bx-bell"></i>
      <span class="notification-badge">3</span>
    </div>
    
    <div class="create-button" (click)="toggleCreateMenu()">
      <i class="bx bx-plus"></i>
      <span>Create</span>
      <div class="create-dropdown" [class.active]="isCreateMenuOpen">
        <a href="#"><i class="bx bx-error"></i> New Error</a>
        <a href="#"><i class="bx bx-check-shield"></i> New Solution</a>
      </div>
    </div>
    
    <div class="profile-section" (click)="toggleProfileMenu()">
      <div class="profile-info">
        <div class="profile-name">Jane Doe</div>
        <div class="profile-role">Full Stack Developer</div>
      </div>
      
      <div class="profile-image">
        <img src="https://i.pinimg.com/236x/ce/40/b6/ce40b67b89fbba423a330ee1a6bff863.jpg" alt="Profile Image">
        <div class="online-indicator"></div>
      </div>
      
      <i class="bx bx-chevron-down profile-dropdown-icon"></i>
      
      <div class="profile-dropdown" [class.active]="isProfileMenuOpen">
        <div class="dropdown-header">
          <strong>Jane Doe</strong>
          <span>Full Stack Developer</span>
        </div>
        <div class="dropdown-divider"></div>
        <a href="#"><i class="bx bx-user"></i> View Profile</a>
        <a href="#"><i class="bx bx-code-curly"></i> My Solutions</a>
        <a href="#"><i class="bx bx-error-circle"></i> My Errors</a>
        <a href="#"><i class="bx bx-badge-check"></i> Achievements</a>
        <div class="dropdown-divider"></div>
        <a href="#"><i class="bx bx-cog"></i> Settings</a>
        <a href="#" class="logout"><i class="bx bx-log-out"></i> Logout</a>
      </div>
    </div>
  </div>
</div>
