<div class="problem-creation-container">
  <form [formGroup]="problemForm" (ngSubmit)="onSubmit()" class="problem-form">
    <h2 class="form-title">
      <i class="fas fa-bug"></i> Create New Problem/Error
    </h2>

    <div class="form-grid">
      <!-- Title Input -->
      <div class="form-group">
        <label for="title">Title</label>
        <input 
          type="text" 
          id="title" 
          formControlName="title" 
          placeholder="Enter problem title"
          [ngClass]="{'invalid': isFieldInvalid('title')}"
        >
        <div *ngIf="isFieldInvalid('title')" class="error-message">
          {{ getErrorMessage('title') }}
        </div>
      </div>

      <!-- Description Input -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea 
          id="description" 
          formControlName="description" 
          placeholder="Provide detailed problem description"
          [ngClass]="{'invalid': isFieldInvalid('description')}"
        ></textarea>
        <div *ngIf="isFieldInvalid('description')" class="error-message">
          {{ getErrorMessage('description') }}
        </div>
      </div>

      <!-- Stack Input -->
      <div class="form-group">
        <label for="stack">Stack</label>
        <select 
          id="stack" 
          formControlName="stackId"
          [ngClass]="{'invalid': isFieldInvalid('stackId')}"
        >
          <option value="">Select Stack</option>
          <option *ngFor="let stack of stacks" [value]="stack.id">
            {{ stack.name }}
          </option>
        </select>
        <div *ngIf="isFieldInvalid('stackId')" class="error-message">
          Stack is required
        </div>
      </div>

      <!-- Category Input -->
      <div class="form-group">
        <label for="category">Category</label>
        <select 
          id="category" 
          formControlName="categoryId"
          [ngClass]="{'invalid': isFieldInvalid('categoryId')}"
        >
          <option value="">Select Category</option>
          <option *ngFor="let category of categories" [value]="category.id">
            {{ category.name }}
          </option>
        </select>
        <div *ngIf="isFieldInvalid('categoryId')" class="error-message">
          Category is required
        </div>
      </div>

      <!-- Error Code Input -->
      <div class="form-group">
        <label for="errorCode">Error Code</label>
        <input 
          type="text" 
          id="errorCode" 
          formControlName="errorCode" 
          placeholder="Enter error code if applicable"
        >
      </div>

      <!-- Context Input -->
      <div class="form-group">
        <label for="context">Context</label>
        <input 
          type="text" 
          id="context" 
          formControlName="context" 
          placeholder="Provide context of the error"
        >
      </div>

      <!-- Environment Input -->
      <div class="form-group">
        <label for="environment">Environment</label>
        <input 
          type="text" 
          id="environment" 
          formControlName="environment" 
          placeholder="Development, Production, Staging"
        >
      </div>

      <!-- Tags Input -->
      <div class="form-group">
        <label for="tags">Tags</label>
        <input 
          type="text" 
          id="tags" 
          formControlName="tags" 
          placeholder="Add relevant tags (comma-separated)"
        >
        <div *ngIf="isFieldInvalid('tags')" class="error-message">
          At least one tag is required
        </div>
      </div>

      <!-- Reproducibility -->
      <div class="form-group checkbox-group">
        <label>
          <input 
            type="checkbox" 
            formControlName="reproducibility"
          >
          Reproducible Error
        </label>
      </div>

      <!-- Logs Input -->
      <div class="form-group">
        <label for="logs">Logs</label>
        <textarea 
          id="logs" 
          formControlName="logs" 
          placeholder="Paste relevant log information"
        ></textarea>
      </div>

      <!-- Priority Level -->
      <div class="form-group">
        <label for="priorityLevel">Priority Level</label>
        <select 
          id="priorityLevel" 
          formControlName="priorityLevel"
        >
          <option value="0">Low</option>
          <option value="1">Medium-Low</option>
          <option value="2">Medium</option>
          <option value="3">Medium-High</option>
          <option value="4">High</option>
          <option value="5">Critical</option>
        </select>
      </div>

      <!-- Image Upload Section -->
      <div class="form-group image-upload-section">
        <label>Error Screenshots</label>
        <div class="image-upload-container">
          <div class="image-preview-area">
            <img 
              *ngIf="mainPreviewImage" 
              [src]="mainPreviewImage" 
              class="main-preview-image"
            >
          </div>
          
          <div class="image-input-wrapper">
            <input 
              type="file" 
              (change)="onFileSelected($event)" 
              accept="image/*" 
              multiple
              #fileInput
            >
            <div class="file-upload-placeholder">
              <i class="fas fa-cloud-upload-alt"></i>
              <span>Upload Images</span>
            </div>
          </div>

          <div class="uploaded-images-gallery">
            <div 
              *ngFor="let image of uploadedImages; let i = index" 
              class="uploaded-image-item"
              (click)="selectMainImage(image)"
            >
              <img [src]="image" alt="Uploaded Image">
              <button 
                class="remove-image-btn" 
                (click)="removeImage(i, $event)"
              >
                &times;
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Actions -->
    <div class="form-actions">
      <button 
        type="submit" 
        class="submit-btn" 
        [disabled]="!problemForm.valid"
      >
        <i class="fas fa-save"></i> Create Problem
      </button>
      <button 
        type="button" 
        class="cancel-btn" 
        (click)="onCancel()"
      >
        <i class="fas fa-times"></i> Cancel
      </button>
    </div>
  </form>
</div>
